# AFFILIO on Synology DSM (Container Manager / docker compose v2).
#
# Copy .env.example → .env in this directory and fill in the host paths and secrets.
# Only the web container publishes a port. PostgreSQL and the API stay on the internal network.
# Originals and proxies are mounted READ-ONLY; AFFILIO can only write thumbnails and exports.

name: affilio

x-api-image: &api-image
  image: ${AFFILIO_API_IMAGE:-affilio-api:latest}
  build:
    context: ../../../apps/api
    dockerfile: Dockerfile
    args:
      APP_UID: ${AFFILIO_UID:-1026}
      APP_GID: ${AFFILIO_GID:-100}

x-api-env: &api-env
  APP_ENV: production
  LOG_FORMAT: json
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DOCS_ENABLED: ${DOCS_ENABLED:-false}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-affilio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-affilio}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-demo-org}
  MEDIA_ADMIN_TOKEN: ${MEDIA_ADMIN_TOKEN:?set MEDIA_ADMIN_TOKEN}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
  # The API has no published port; only the web proxy reaches it and sets X-Forwarded-For.
  TRUST_PROXY_HEADERS: "true"
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
  PUBLICATION_MIN_GAP_MINUTES: ${PUBLICATION_MIN_GAP_MINUTES:-30}
  # Meta connection (M3B.1A). Live provider only in production; values come from .env.
  META_PROVIDER_MODE: live
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
  META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
  META_OAUTH_SCOPES: ${META_OAUTH_SCOPES:-pages_show_list,pages_read_engagement,pages_manage_posts}
  META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
  CREDENTIAL_ENCRYPTION_KEYS: ${CREDENTIAL_ENCRYPTION_KEYS:-}
  CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID: ${CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID:-}
  SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-30}
  OAUTH_STATE_RETENTION_HOURS: ${OAUTH_STATE_RETENTION_HOURS:-24}

x-media-mounts: &media-mounts
  - type: bind
    source: ${AFFILIO_ORIGINALS_HOST_PATH:?set AFFILIO_ORIGINALS_HOST_PATH}
    target: /media/originals
    read_only: true
  - type: bind
    source: ${AFFILIO_PROXIES_HOST_PATH:?set AFFILIO_PROXIES_HOST_PATH}
    target: /media/proxies
    read_only: true
  - type: bind
    source: ${AFFILIO_FINALS_HOST_PATH:?set AFFILIO_FINALS_HOST_PATH}
    target: /media/finals
    read_only: true
  - type: bind
    source: ${AFFILIO_THUMBNAILS_HOST_PATH:?set AFFILIO_THUMBNAILS_HOST_PATH}
    target: /data/thumbnails
  - type: bind
    source: ${AFFILIO_EXPORTS_HOST_PATH:?set AFFILIO_EXPORTS_HOST_PATH}
    target: /data/exports

services:
  postgres:
    image: postgres:17-alpine
    container_name: affilio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-affilio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-affilio}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - type: bind
        source: ${AFFILIO_DATA_HOST_PATH:?set AFFILIO_DATA_HOST_PATH}/postgres
        target: /var/lib/postgresql/data
    # No `ports:` on purpose — never reachable from outside the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-affilio} -d ${POSTGRES_DB:-affilio}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 128m
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-1.0}"
          memory: ${POSTGRES_MEMORY:-512M}
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    <<: *api-image
    container_name: affilio-api
    restart: unless-stopped
    command: ["api"]
    environment:
      <<: *api-env
      RUN_MIGRATIONS_ON_START: "true"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    volumes: *media-mounts
    depends_on:
      postgres:
        condition: service_healthy
    # No `ports:` — the web container proxies /api/* internally.
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-1.0}"
          memory: ${API_MEMORY:-512M}
    logging: *logging

  worker:
    <<: *api-image
    container_name: affilio-worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *api-env
    volumes: *media-mounts
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy # api applies migrations first
    healthcheck:
      test: ["CMD", "python", "-m", "affilio.worker", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-2.0}"
          memory: ${WORKER_MEMORY:-768M}
    logging: *logging

  web:
    image: ${AFFILIO_WEB_IMAGE:-affilio-web:latest}
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        APP_UID: ${AFFILIO_UID:-1026}
        APP_GID: ${AFFILIO_GID:-100}
    container_name: affilio-web
    restart: unless-stopped
    environment:
      # The web container is identity-neutral: it forwards the browser's session cookie and
      # never holds the service token (M3A).
      API_INTERNAL_URL: http://api:8000
    ports:
      # LAN only. Bind to the NAS LAN IP (AFFILIO_BIND_ADDRESS). Authentication exists since
      # M3A but there is no login rate limiting yet: keep it off the internet.
      - "${AFFILIO_BIND_ADDRESS:-0.0.0.0}:${AFFILIO_WEB_PORT:-3080}:3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPUS:-1.0}"
          memory: ${WEB_MEMORY:-384M}
    logging: *logging
