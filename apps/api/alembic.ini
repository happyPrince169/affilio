# Alembic configuration for the AFFILIO API.
# The database URL is NOT stored here; env.py resolves it from (in order):
#   1. `-x url=...` / programmatic `sqlalchemy.url` override
#   2. ALEMBIC_DATABASE_URL
#   3. DATABASE_URL via affilio.core.config.Settings

[alembic]
script_location = %(here)s/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC
truncate_slug_length = 40
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = uv
ruff_fix.options = run ruff check --fix REVISION_SCRIPT_FILENAME

# Logging is configured by affilio.core.logging inside env.py.
[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
