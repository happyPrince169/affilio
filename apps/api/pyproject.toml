[project]
name = "affilio-api"
version = "0.1.0"
description = "AFFILIO API — modular monolith backend for the AI-Powered Affiliate Content Operating System."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.120,<1.0",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "structlog>=24.4",
  "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
  "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/affilio"]

[tool.uv]
# Python 3.12 is the floor; uv will download it if it is not already installed.
python-preference = "managed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "alembic"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "S",   # bandit (security)
  "SIM", # simplify
  "RUF", # ruff-specific
  "T20", # no stray print()
  "DTZ", # timezone-aware datetimes
]
ignore = [
  "RUF012", # mutable class attributes — SQLAlchemy/Pydantic patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]       # asserts and dummy credentials are fine in tests
"src/affilio/scripts/**" = ["T201"]          # CLI scripts may print
"alembic/versions/**" = ["E501"]             # long autogenerated lines

[tool.ruff.lint.isort]
known-first-party = ["affilio"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --strict-markers"
markers = [
  "database: tests that need a reachable PostgreSQL (TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:affilio.*"]
